<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Сумма первых букв ФИО</title>
  <style>
  body {
    font-family: Arial, sans-serif;
    padding: 30px;
  }

  .columns {
    display: flex;
    gap: 20px;
  }

  .column {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 180px;
  }

  .column button,
  .column input {
    padding: 10px;
    font-size: 16px;
  }

  .column input {
    text-align: center;
  }

  .actions {
    display: flex;
    gap: 20px;
    margin-top: 20px;
  }

  .actions button {
    padding: 10px 20px;
    font-size: 16px;
  }
</style>
</head>
<body>
<div class="columns">
  <div class="column">
    <button id="btn1">Ким (12)</button>
    <input type="text" id="input1">
  </div>
  <div class="column">
    <button id="btn2">Варвара (3)</button>
    <input type="text" id="input2">
  </div>
  <div class="column">
    <button id="btn3">Михайловна (14)</button>
    <input type="text" id="input3">
  </div>
</div>

<div class="actions">
  <button id="calcBtn">Рассчитать</button>
  <button id="clearBtn">Очистить</button>
</div>
<script>
  document.getElementById("btn1").addEventListener("click", function () {
    document.getElementById("input1").value = 12;
  });

  document.getElementById("btn2").addEventListener("click", function () {
    document.getElementById("input2").value = 3;
  });

  document.getElementById("btn3").addEventListener("click", function () {
    document.getElementById("input3").value = 14;
  });
  document.getElementById("clearBtn").addEventListener("click", function () {
  document.getElementById("input1").value = "";
  document.getElementById("input2").value = "";
  document.getElementById("input3").value = "";
});
  document.getElementById("calcBtn").addEventListener("click", function () {
  var a = document.getElementById("input1").value;
  var b = document.getElementById("input2").value;
  var c = document.getElementById("input3").value;

  if (a === "" || b === "" || c === "") {
    alert("Сначала нажмите на все три кнопки с ФИО.");
    return;
  }

  var sum = Number(a) + Number(b) + Number(c);

  var now = new Date();
  var year = now.getFullYear();
  var month = String(now.getMonth() + 1).padStart(2, "0");
  var day = String(now.getDate()).padStart(2, "0");
  var hour = String(now.getHours()).padStart(2, "0");
  var minute = String(now.getMinutes()).padStart(2, "0");

  var message =
    "Сумма первых букв ФИО:\n" +
    a + " + " + b + " + " + c + " = " + sum + "\n\n" +
    "Работу выполнил:\n" +
    "Ким Варвара Михайловна\n" +
    "Группа 09-503\n\n" +
    "Отправлено на проверку:\n" +
    year + "-" + month + "-" + day + " " + hour + ":" + minute;

  alert(message);
});


</script>
</body>
</html>
